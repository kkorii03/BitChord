name: UI tour (emulator screenshots)

# Builds the dev debug app, runs it on an emulator in Korean and screenshots
# the main screens (see .github/ui-tour/tour.sh). Read the artifact locally.
on:
  push:
    branches: ['ui-tour']
  workflow_dispatch:
    inputs:
      quick:
        description: 'Only home, explore, search and now playing'
        type: boolean
        default: true
      gated:
        description: 'Force the Korea-without-Premium home (debug switch)'
        type: boolean
        default: true
      api-level:
        description: 'Android API level for the emulator (default 34)'
        type: string
        default: '34'
      profile:
        description: 'AVD profile: pixel_7 (default), pixel_2, pixel_tablet'
        type: string
        default: 'pixel_7'

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # task/nextprep-proof only: this branch's dispatch runs the queue proof in
      # scripts/smoke/run.sh instead of the tour (smoke-play can't be dispatched).
      - name: Bundle lyrics AI keys
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, re
          p = "app/src/main/res/values/strings.xml"
          s = open(p, encoding="utf-8").read()
          for name, env in (("default_deepgram_api_key", "DEEPGRAM_API_KEY"), ("default_gemini_api_key", "GEMINI_API_KEY")):
              value = os.environ.get(env, "").strip()
              if not value:
                  print(f"{name}: no secret, left empty")
                  continue
              pat = re.compile(r'<string name="%s"([^>]*)(?:/>|>[^<]*</string>)' % name)
              s, n = pat.subn(lambda m: f'<string name="{name}"{m.group(1)}>{value}</string>', s)
              print(f"{name}: bundled={n == 1}")
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDevDebug --console=plain
          ls -la app/build/outputs/apk/dev/debug/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The listener's own exported settings (sources, proxy, quality, lyrics),
      # so the tour shows the app as they use it — same hand-off as smoke-play.
      - name: Listener settings
        env:
          SMOKE_SETTINGS_B64: ${{ secrets.SMOKE_SETTINGS_B64 }}
        run: |
          if [ -n "$SMOKE_SETTINGS_B64" ]; then
            echo "$SMOKE_SETTINGS_B64" | base64 -d | sed '1s/^\xEF\xBB\xBF//' > "$RUNNER_TEMP/smoke.bitchord-settings"
            python3 scripts/smoke/set_proxy_port.py "$RUNNER_TEMP/smoke.bitchord-settings" "${SMOKE_PROXY_PORT:-8889}" --emulator
            echo "SMOKE_SETTINGS_FILE=$RUNNER_TEMP/smoke.bitchord-settings" >> "$GITHUB_ENV"
            echo "::notice title=tour::listener settings loaded"
          else
            echo "::warning title=tour::no SMOKE_SETTINGS_B64 secret - touring a fresh install"
          fi

      - name: Tour
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TOUR_QUICK: ${{ (github.event_name != 'workflow_dispatch' || inputs.quick) && '1' || '0' }}
          TOUR_GATED: ${{ (github.event_name != 'workflow_dispatch' || inputs.gated) && '1' || '0' }}
        with:
          api-level: ${{ github.event_name == 'workflow_dispatch' && inputs.api-level || 34 }}
          arch: x86_64
          target: google_apis
          profile: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'pixel_7' }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Device-wide proxy through the runner's authfwd (see set_proxy_port.py).
          script: |
            if [ -n "$SMOKE_UPSTREAM_PROXY" ]; then (nohup python3 scripts/smoke/authfwd.py "$SMOKE_UPSTREAM_PROXY" > "$RUNNER_TEMP/authfwd.log" 2>&1 &) ; sleep 2; adb shell settings put global http_proxy 10.0.2.2:3128; fi
            SMOKE_QUEUE_PROOF=1 bash scripts/smoke/run.sh

      # The artifact of a public repo is downloadable by anyone; a bundled key
      # that reached a log line (e.g. a request URL) must not go with it.
      - name: Scrub keys from artifact
        if: always()
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          keys = [k for k in (os.environ.get("DEEPGRAM_API_KEY", "").strip(), os.environ.get("GEMINI_API_KEY", "").strip()) if k]
          hits = 0
          for f in pathlib.Path("shots").rglob("*"):
              if not keys or not f.is_file() or f.suffix in (".wav", ".png", ".webm"):
                  continue
              b = f.read_bytes()
              n = b
              for k in keys:
                  n = n.replace(k.encode(), b"***")
              if n != b:
                  hits += 1
                  f.write_bytes(n)
          print(f"scrubbed files: {hits}")
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tour
          path: shots/
