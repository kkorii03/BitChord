name: UI tour (emulator screenshots)

# Builds the dev debug app, runs it on an emulator in Korean and screenshots
# the main screens (see .github/ui-tour/tour.sh). Read the artifact locally.
on:
  push:
    branches: ['ui-tour']
  workflow_dispatch:
    inputs:
      quick:
        description: 'Only home, explore, search and now playing'
        type: boolean
        default: true
      gated:
        description: 'Force the Korea-without-Premium home (debug switch)'
        type: boolean
        default: true

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDevDebug --console=plain
          ls -la app/build/outputs/apk/dev/debug/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tour
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TOUR_QUICK: ${{ (github.event_name != 'workflow_dispatch' || inputs.quick) && '1' || '0' }}
          TOUR_GATED: ${{ (github.event_name != 'workflow_dispatch' || inputs.gated) && '1' || '0' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/ui-tour/tour.sh

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tour
          path: shots/
