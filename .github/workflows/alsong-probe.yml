name: ALSong probe (temporary)
on:
  push:
    branches: [alsong-test]
    paths: ['.github/probe/**', '.github/workflows/alsong-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/probe/alsong_probe.py > .github/probe/result.txt 2>&1 || true
      - run: |
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git add .github/probe/result.txt
          git commit -m "probe result" && git push
