name: Korean WIP check

# Diagnosis only (branch task/review-1115-diag2, never merged): the CI app list
# exactly as ko-wip-check.yml runs it, with a thread dump of the test JVM
# every 4 s and every suite's XML kept, to see what the LyricsController tests
# wait on when the whole list runs in one JVM (43993585345).
on:
  workflow_dispatch:

concurrency:
  group: ko-wip-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: App tests with thread dumps
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          mkdir -p dumps
          (
            n=0
            while true; do
              sleep 4
              for p in $(pgrep -f 'Gradle Test Executor'); do
                J=$(ps -o args= -p "$p" | awk '{print $1}')
                D=$(dirname "$J")
                n=$((n+1))
                ts=$(date -u +%H:%M:%S)
                if [ -x "$D/jstack" ]; then
                  "$D/jstack" "$p" > "dumps/$n-$ts.txt" 2>&1
                elif [ -x "$D/jcmd" ]; then
                  "$D/jcmd" "$p" Thread.print > "dumps/$n-$ts.txt" 2>&1
                else
                  echo "no jstack beside $J" > "dumps/$n-$ts.txt"
                fi
              done
            done
          ) &
          DUMPER=$!
          ./gradlew :app:testProdDebugUnitTest --tests '*LyricsTimingRoughRefineTest' --tests '*NextPrepHandoverTest' --tests '*SheetChoiceTest' --tests '*LyricsControllerSheetChoiceTest' --tests '*LyricsControllerTrackChangeTest' --tests '*KoHeadphoneResumePolicyTest' --tests '*KoPrefetchKeepRunningTest' --tests '*KoAutoplaySessionExclusionTest' --tests '*PartyStashCoverFieldsTest' --tests '*WidgetQueueWaiterTest' --tests '*TranslationDownloadGateTest' --tests '*KoDownloadPipelineInPlaceReplaceTest' --tests '*KoDownloadQueueRememberResetsTermsTest' --tests '*DownloadsRecordPersistsCurrentTest' --tests '*LikedAutoDownloadKeepsBackgroundLikeTest' --tests '*DownloadsAdoptSkipsLookupsTest' --tests '*KoSourceRestEscalationTest' --tests '*HqRepairFloorTest' --tests '*KoLockSheetTest' --tests '*TrackDiagnosticsPreparedTest' --tests '*StartupTraceHomeLineTest' --tests '*LyricsTimingBaseChoiceLogTest' --tests '*KoMvRepairAliasedFileTest' --tests '*KoDownloadNowPlainTermsTest' --tests '*ManifestFileLargeM4aIndexTest' --tests '*ManifestFileTest' --tests '*HqVersionGuardWiringTest' --tests '*LyricsTimingHeardWordsTest' --tests '*LyricsTimingVideoAnswerTest' --tests '*LyricsTimingVideoQuickListenTest' --tests '*LyricsTimingHeardTailTest' --tests '*ListenerMovesTest' --tests '*VersionSwapPolicyTest' --tests '*LyricsTimingRestoreBackupTest' --tests '*LyricsTimingGuardTest' --tests '*LyricsTimingAiKeyTest' --tests '*VersionAudioAlignerCorrelationTest' --tests '*CoverSingerWritesTest' --tests '*LateHandoverRowTest' --tests '*VideoAudioOpeningWaitTest' --tests '*SongHearingTest' --tests '*SwapHearingTest' --tests '*LyricsTimingFileClockTest' --tests '*LyricsTimingGrossDisagreementTest' --tests '*PermanentAwareLoadErrorPolicyTest' --tests '*SearchLoadingPolicyTest' --tests '*AutoplayTasteDispatchTest' --tests '*DirectSourceFirstAnswerTest' --tests '*UpgradeRenditionGuardTest' --tests '*DownloadsManifestKeepTest' --tests '*DownloadsSniffKeepTest' --tests '*NerdStatsFormatSourceTest' --tests '*PartyVideoRoundTripTest' --tests '*OfflinePlaylistsVideoTest' --tests '*PlayerConnectionCoverMetadataTest' --tests '*LyricsTimingDownloadedCoverTest' --tests '*LyricsTimingSpentBeforeTest' --tests '*AlignFarmTest' --tests '*LyricsTimingRefitSpendTest' --tests '*LyricsTimingRefitReplacedSheetTest' --tests '*DownloadedCoverTypeTest' --tests '*KoListeningStatsDisplayTest' --tests '*DownloaderTelegramTest' --tests '*StationPlaybackTest' --tests '*AutoplayCoverFallbackTest' --tests '*LyricsTimingUninitializedContextTest' --tests '*LyricsTimingFilesDirRetryTest' --tests '*QueueHistoryHookTest' --tests '*StartupLaunchWiringTest' --tests '*SettingsForkRegressionTest' --tests '*LyricsMeasureCancellationTest' --tests '*PlayerMergeWiringTest' --tests '*DecodePriorityGateTest' --tests '*LyricsTimingLateVersionReuseTest' --tests '*LyricsTimingMeasurementGateTest' --tests '*SongCheckProbeTest' --tests '*CommittedSpanReaderTest' --tests '*PreparedMixPassTest' --tests '*LyricsControllerCoverAiTest' --tests '*VideoAudioByteLruTest' --tests '*AnalysisCancelTest' --tests '*LyricsTimingFlightCancellationTest' --tests '*MeshPhaseTest' --tests '*KoLyricsMotionTest' --tests '*QueueRestoreGuardTest' --tests '*QueueRestoreDispatcherTest' --tests '*KoCacheRetentionTest' --tests '*KoAnalysisWaitsTest' --tests '*KoAnalysisHeadEngineTest' --tests '*LyricsControllerRequestTest' --tests '*LyricsRequestGateTest' --tests '*VideoAudioResamplerTest' --tests '*DownloadsManifestKeepTest' --tests '*ListenTogetherStringsFormatTest' --tests '*KoPrefetchReadAheadTest' --tests '*DownloadsDeleteCollectionTest' --tests '*KoDiagnosticsTest' --tests '*DiagnosticsExportSettingsTest' --tests '*SubstituteRenditionKeyTest' --tests '*LyricsTimingOriginalClockTest' --tests '*LyricsTimingOpenedCopyClockTest' --tests '*LyricsTimingLocalClockTest' --tests '*LyricsTimingClockTest' --tests '*StreamClockChangeSignalTest' --tests '*UsbAudioLogicTest' --tests '*DacVolumeTest' --tests '*DacFormatConverterTest' --test