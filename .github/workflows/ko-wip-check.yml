name: Korean WIP check

# Survey only (branch task/review-1115-alltests): runs EVERY unit test once and
# lists each suite's counts and each failing test by class and name, so the
# fork's tests that are missing from the real lists can be sorted. Messages
# are not printed (fixtures may hold lyric text).
on:
  workflow_dispatch:

concurrency:
  group: ko-wip-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: All unit tests (survey)
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :shared:jvmTest :sharedUi:jvmTest :app:testProdDebugUnitTest --continue --console=plain > all.log 2>&1
          echo "GRADLE_STATUS $?"
          grep -E "^e: |BUILD (SUCCESSFUL|FAILED)|> Task .* FAILED" all.log | head -60
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob('*/build/test-results/*/*.xml'))
          print('XML_FILES', len(files))
          for f in files:
              try:
                  r = ET.parse(f).getroot()
              except Exception:
                  print('BADXML', f)
                  continue
              print('SUITE', f.split('/')[0], r.get('name'), 'tests=%s failures=%s errors=%s skipped=%s' % (r.get('tests'), r.get('failures'), r.get('errors'), r.get('skipped')))
              for tc in r.iter('testcase'):
                  for k in ('failure', 'error'):
                      if tc.find(k) is not None:
                          print('FAIL', f.split('/')[0], tc.get('classname'), '::', tc.get('name'))
          EOF
          exit 0
