name: Korean WIP check

# Compiles a work-in-progress branch (ko17-wip, ko18-wip, ...) and runs the
# lyrics tests, without building or publishing a release. Releases still come
# only from main via korean-build.yml.
#
# Results are echoed as annotations (::notice / ::error) so they can be read
# with `gh run view` even where the raw log download is not reachable.
on:
  push:
    branches: ['ko*-wip']
  workflow_dispatch:

concurrency:
  group: ko-wip-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Live lookups against Vibe/Bugs and friends: reported, never blocking.
      # A Korean service's dawn maintenance (seen 04:00 KST) must not stop
      # every unrelated change from passing.
      - name: Live Korean lyrics (non-blocking)
        continue-on-error: true
        shell: bash
        env:
          LIVE_KR_LYRICS: '1'
        run: |
          set +e -o pipefail
          chmod +x gradlew
          ./gradlew :shared:jvmTest --tests '*LyricsMismatchWordsTest' --tests 'com.music.bitchord.data.lyrics.KoreanLyricsLiveTest' --tests 'com.music.bitchord.data.lyrics.LyricsLookupTimingLiveTest' --console=plain 2>&1 | tee live.log
          status=${PIPESTATUS[0]}
          timing=$(grep -ho "LOOKUP_MS [^<]*" shared/build/test-results/jvmTest/*.xml 2>/dev/null | sed 's/LOOKUP_MS //' | tr '\n' '|' || true)
          [ -n "$timing" ] && echo "::notice title=timing::$timing" || true
          grep -E "FAILED|AssertionError" live.log | head -10 | while IFS= read -r l; do echo "::warning title=live-lyrics::$l"; done || true
          exit $status

      - name: Lyrics tests
        shell: bash
        run: |
          set +e -o pipefail
          chmod +x gradlew
          ./gradlew :shared:jvmTest --tests '*SyncDumpTest' --tests '*GroqWhisperTest' --tests '*FeatureHealthVersionLaunchTest' --tests '*KoRepeatLogTest' --tests '*HeardWordsTest' --tests '*WordSweepStressTest' --tests '*LyricsMismatchWordsTest' --tests '*SongVersionRetry*Test' --tests '*LyricsPerLineOwnTranscriptTest' --tests '*SheetIdentityPolicyTest' --tests '*BaseFlipPolicyTest' --tests '*CoverTitlesBatchTest' --tests '*LyricsMismatchRightSheetTest' --tests '*LyricsMismatchRememberTest' --tests '*SongSyncRetryTest' --tests '*InnertubeWithRetryTest' --tests '*LyricsWordAlignPaceTest' --tests '*ArtistChannelSuffixTest' --tests '*DeepgramAudioMsTest' --tests '*RefineExtendPolicyTest' --tests '*StreamFormatSuspectLosslessTest' --tests '*PoTokenPageTokenSizeTest' --tests '*CoverOriginalLyricsQueryTest' --tests '*QueueVersionAheadTest' --tests '*SearchHistoryVideoTest' --tests '*StoredVideoRowTest' --tests '*VideoPictureRetryTest' --tests '*CoverDisplay1103Test' --tests '*ExploreArtworkTest' --tests '*AudioSwitchArtistNameTest' --tests '*AudioSwitchCoverPassTest' --tests '*CoverTitlesDownloadedCoverTest' --tests '*StationFirstAnswerTest' --tests 'com.music.bitchord.data.charts.ChartsParserTest' --tests 'com.music.bitchord.data.cover.YouTubeCoverSharedLookupTest' --tests 'com.music.bitchord.data.net.ArtistCandidateTest' --tests 'com.music.bitchord.data.YouTubeFallbackContinuationTest' --tests 'com.music.bitchord.data.innertube.StreamResolverVerdictFinalTest' --tests 'com.music.bitchord.ko.KoVersionGuardRgaTest' --tests 'com.music.bitchord.ko.KoHqWarpTest' --tests 'com.music.bitchord.data.innertube.StreamResolverProxySilenceTest' --tests 'com.music.bitchord.data.net.ProxyDownloadKeepsPlayerUrlTest' --tests 'com.music.bitchord.data.innertube.StreamResolverProxyProbeStallTest' --tests 'com.music.bitchord.data.innertube.StreamResolverRouteRefusalBenchTest' --tests '*InnerTubeXVideoFallbackTest' --tests '*LyricsVersionLanguageTest' --tests '*LyricsLookupDeadlineTest' --te