name: Korean WIP check

# Compiles a work-in-progress branch (ko17-wip, ko18-wip, ...) and runs the
# lyrics tests, without building or publishing a release. Releases still come
# only from main via korean-build.yml.
#
# Results are echoed as annotations (::notice / ::error) so they can be read
# with `gh run view` even where the raw log download is not reachable.
on:
  push:
    branches: ['ko*-wip']
  workflow_dispatch:

concurrency:
  group: ko-wip-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Live lookups against Vibe/Bugs and friends: reported, never blocking.
      # A Korean service's dawn maintenance (seen 04:00 KST) must not stop
      # every unrelated change from passing.
      - name: Live Korean lyrics (non-blocking)
        continue-on-error: true
        shell: bash
        env:
          LIVE_KR_LYRICS: '1'
        run: |
          set +e -o pipefail
          chmod +x gradlew
          ./gradlew :shared:jvmTest --tests 'com.music.bitchord.data.lyrics.KoreanLyricsLiveTest' --tests 'com.music.bitchord.data.lyrics.LyricsLookupTimingLiveTest' --console=plain 2>&1 | tee live.log
          status=${PIPESTATUS[0]}
          timing=$(grep -ho "LOOKUP_MS [^<]*" shared/build/test-results/jvmTest/*.xml 2>/dev/null | sed 's/LOOKUP_MS //' | tr '\n' '|' || true)
          [ -n "$timing" ] && echo "::notice title=timing::$timing" || true
          grep -E "FAILED|AssertionError" live.log | head -10 | while IFS= read -r l; do echo "::warning title=live-lyrics::$l"; done || true
          exit $status

      - name: Lyrics tests
        shell: bash
        run: |
          set +e -o pipefail
          chmod +x gradlew
          ./gradlew :shared:jvmTest --tests 'com.music.bitchord.data.lyrics.*' --tests 'com.music.bitchord.data.innertube.InnertubeSearchPrivacyTest' --tests 'com.music.bitchord.data.innertube.MusicGateFallbackTest' --tests 'com.music.bitchord.data.innertube.YouTubeWebParserTest' --tests 'com.music.bitchord.data.innertube.DirectClientResolverTest' --tests 'com.music.bitchord.data.innertube.AuthorizationHeaderTest' --tests 'com.music.bitchord.data.innertube.YouTubeMusicClassifierTest' --tests 'com.music.bitchord.data.cover.*' --tests 'com.music.bitchord.data.model.HomeShelfMergeTest' --tests 'com.music.bitchord.data.model.AccountIdentityMergeTest' --tests 'com.music.bitchord.data.settings.PrivateListeningTest' --tests 'com.music.bitchord.data.charts.*' --tests 'com.music.bitchord.data.RecentShelfTest' --tests 'com.music.bitchord.data.YouTubeFallbackFeedTest' --tests 'com.music.bitchord.data.YouTubeFallbackFeedRulesTest' --tests 'com.music.bitchord.data.YouTubeFallbackHomeCacheTest' --tests '*ExploreCategoriesTest' --tests '*ExploreCategoryArtworkCacheTest' --tests '*YouTubeDisplayCleanerTest' --tests '*YouTubeCategoryRulesTest' --tests '*YouTubeMusicPlaylistCardsTest' --tests '*CatalogSongMapperTest' --tests '*CatalogSongMapperBudgetTest' --tests 'com.music.bitchord.data.cover.ArtworkThumbnailTest' --tests '*YouTubeWebParserPlaylistResultsTest' --tests 'com.music.bitchord.data.innertube.AccountMenuParserTest' --tests 'com.music.bitchord.data.net.*' :sharedUi:jvmTest --tests 'com.music.bitchord.ui.LyricsProviderStateTest' --console=plain 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          for f in shared/build/test-results/jvmTest/*.xml; do
            [ -f "$f" ] || continue
            line=$(grep -o '<testsuite [^>]*>' "$f" | head -1 || true)
            echo "::notice title=tests::$(basename "$f") $(echo "$line" | grep -oE '(tests|failures|errors|skipped)="[0-9]+"' | tr '\n' ' ')"
          done
          # One notice for every measurement: GitHub shows only ten per step.
          timing=$(grep -ho "LOOKUP_MS [^<]*" shared/build/test-results/jvmTest/*.xml 2>/dev/null | sed 's/LOOKUP_MS //' | tr '\n' '|' || true)
          [ -n "$timing" ] && echo "::notice title=timing::$timing" || true
          chroma=$(grep -ho "CHROMA [^<]*" shared/build/test-results/jvmTest/*.xml 2>/dev/null | sed 's/CHROMA //' | tr '\n' '|' || true)
          [ -n "$chroma" ] && echo "::notice title=chroma::$chroma" || true
          grep -E "^e: |FAILED|AssertionError|expected:" test.log | head -30 | while IFS= read -r l; do echo "::error title=test::$l"; done || true
          grep -E "BUILD (SUCCESSFUL|FAILED)" test.log | while IFS= read -r l; do echo "::notice title=tests-build::$l"; done || true
          exit $status

      - name: Compile the app
        shell: bash
        run: |
          set +e -o pipefail
          ./gradlew :app:compileProdReleaseKotlin -Pbitchord.arm64Only=true --console=plain 2>&1 | tee compile.log
          status=${PIPESTATUS[0]}
          grep -E "^e: " compile.log | head -40 | while IFS= read -r l; do echo "::error title=kotlin::$l"; done || true
          grep -E "^w: .*(LyricsTiming|ChromaAlignment|LyricsTimeMap|LyricsOffsetSheet|AudioDecoder|TranslationAhead)" compile.log | head -20 | while IFS= read -r l; do echo "::warning title=kotlin::$l"; done || true
          grep -E "Task :app:compileProdReleaseKotlin|BUILD (SUCCESSFUL|FAILED)" compile.log | while IFS= read -r l; do echo "::notice title=compile::$l"; done || true
          exit $status

      # The desktop app shares the Innertube signing code; compile it so a
      # change there cannot break the desktop build unseen.
      - name: Compile the desktop app
        shell: bash
        run: |
          set +e -o pipefail
          ./gradlew :desktopApp:compileKotlin --console=plain 2>&1 | tee desktop.log
          status=${PIPESTATUS[0]}
          grep -E "^e: " desktop.log | head -40 | while IFS= read -r l; do echo "::error title=desktop::$l"; done || true
          exit $status

      # The app module's pure-logic tests added with the timing-cost and
      # artwork fixes. Named one by one: the rest of app/src/test is not kept
      # green (the audio output tests already fail on this branch's base).
      - name: App playback tests
        shell: bash
        run: |
          set +e -o pipefail
          ./gradlew :app:testProdDebugUnitTest --tests 'com.music.bitchord.playback.smart.AiTimingPolicyTest' --tests 'com.music.bitchord.playback.AnalysisHeadRetryTest' --tests 'com.music.bitchord.ui.player.CanvasFrameRefreshTest' --tests 'com.music.bitchord.data.settings.LowPowerModeTest' --tests 'com.music.bitchord.playback.SkipSegmentsTest' --tests 'com.music.bitchord.data.taste.*' --tests 'com.music.bitchord.data.stats.WriteThrottleTest' --tests 'com.music.bitchord.playback.LyricSubtitleSchedulerTest' --tests 'com.music.bitchord.playback.TranslationAheadPolicyTest' --tests 'com.music.bitchord.UpdateCheckScheduleTest' --tests 'com.music.bitchord.QueueEditTest' --tests 'com.music.bitchord.data.spotify.LocalPlaylistStoreTest' --tests '*LocalMediaFilterTest' --tests '*QueueShuffleTest' --tests 'com.music.bitchord.ScrobbleDurationTest' --tests 'com.music.bitchord.SpotifyImportMatchTest' --tests '*TrackAnalysisDurationTest' --tests '*PlaybackBufferCeilingTest' --tests '*CellularQualityDefaultTest' --tests 'com.music.bitchord.YouTubeLoginCookieTest' --tests 'com.music.bitchord.YouTubeLoginUrlTest' --tests 'com.music.bitchord.data.LogRedactorTest' --tests 'com.music.bitchord.playback.PlayerDeepLinkTest' --tests 'com.music.bitchord.ui.player.PlayerExpandGuardTest' --tests 'com.music.bitchord.data.settings.SearchHistoryPauseTest' --tests 'com.music.bitchord.playback.PlaybackParametersMathTest' --tests '*ListeningStatsSeedTest' --tests 'com.music.bitchord.data.spotify.LocalPlaylistBackupTest' --tests 'com.music.bitchord.data.stats.BackupLibraryRoundTripTest' --tests 'com.music.bitchord.playback.audio.PrecisionAudioSinkTest' --tests 'com.music.bitchord.playback.audio.SilenceSkipOffsetTest' --tests 'com.music.bitchord.playback.audio.SilenceSkipperTest' -Pbitchord.arm64Only=true --console=plain 2>&1 | tee apptest.log
          status=${PIPESTATUS[0]}
          for f in app/build/test-results/testProdDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            line=$(grep -o '<testsuite [^>]*>' "$f" | head -1 || true)
            echo "::notice title=app-tests::$(basename "$f") $(echo "$line" | grep -oE '(tests|failures|errors|skipped)="[0-9]+"' | tr '\n' ' ')"
          done
          grep -E "^e: |FAILED|AssertionError|expected:" apptest.log | head -30 | while IFS= read -r l; do echo "::error title=app-test::$l"; done || true
          exit $status
