name: Korean WIP check

# Diagnosis only (branch task/review-1115-diag, never merged): the four classes
# that timed out in 43993585345 run on their own, next to the fixed and new
# test classes of the working tree, and every suite's order, time and failure
# trace is printed. Fixture strings only; no lyric text is held by these tests.
on:
  workflow_dispatch:

concurrency:
  group: ko-wip-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Diagnosis tests
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :shared:jvmTest --tests 'com.music.bitchord.data.YouTubeDisplayCleanerTest' --continue --console=plain > shared.log 2>&1
          echo "SHARED_STATUS $?"
          grep -E "^e: |BUILD (SUCCESSFUL|FAILED)|> Task .* FAILED" shared.log | head -40
          ./gradlew :app:testProdDebugUnitTest \
            --tests 'com.music.bitchord.ui.LyricsControllerCoverAiTest' \
            --tests 'com.music.bitchord.ui.LyricsControllerSheetChoiceTest' \
            --tests 'com.music.bitchord.ui.LyricsControllerTrackChangeTest' \
            --tests 'com.music.bitchord.ui.SearchRequestPipelineTest' \
            --tests 'com.music.bitchord.IntegrationImportHygieneTest' \
            --tests 'com.music.bitchord.playback.AudioOutputPolicyBoundaryTest' \
            --tests 'com.music.bitchord.playback.AudioOutputPolicyTest' \
            --tests 'com.music.bitchord.playback.audio.DirectAudioStreamingRegressionTest' \
            --tests 'com.music.bitchord.playback.audio.OutputNegotiatorTest' \
            --tests 'com.music.bitchord.playback.audio.bluetooth.BluetoothAudioTrackerTest' \
            --tests 'com.music.bitchord.playback.smart.LyricsTimingResetSongCheckTest' \
            --tests 'com.music.bitchord.data.stats.ListeningRecorderVersionSwapTest' \
            --tests 'com.music.bitchord.ko.KoListenVersionSwapTest' \
            --tests 'com.music.bitchord.playback.VersionSwapListenWiringTest' \
            --tests 'com.music.bitchord.ko.KoListeningStatsRecentMemoTest' \
            --tests 'com.music.bitchord.ui.SearchRetryCacheTest' \
            -Pbitchord.arm64Only=true --continue --console=plain > app.log 2>&1
          echo "APP_STATUS $?"
          grep -E "^e: |BUILD (SUCCESSFUL|FAILED)|> Task .* FAILED|tests completed" app.log | head -60
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('*/build/test-results/*/*.xml')
          rows = []
          for f in files:
              try:
                  r = ET.parse(f).getroot()
              except Exception:
                  print('BADXML', f)
                  continue
              rows.append((r.get('timestamp') or '', f, r))
          rows.sort()
          print('XML_FILES', len(rows))
          for ts, f, r in rows:
              print('SUITE', ts, f.split('/')[0], r.get('name'), 'time=%s tests=%s failures=%s errors=%s skipped=%s' % (r.get('time'), r.get('tests'), r.get('failures'), r.get('errors'), r.get('skipped')))
              failed = False
              for tc in r.iter('testcase'):
                  for k in ('failure', 'error'):
                      el = tc.find(k)
                      if el is not None:
                          failed = True
                          print('FAIL', tc.get('classname'), '::', tc.get('name'), 'time=%s' % tc.get('time'))
                          print('MSG', ((el.get('message') or '')[:300]).replace('\n', ' | '))
                          lines = [l.strip() for l in (el.text or '').splitlines()]
                          keep = [l for l in lines if 'bitchord' in l or 'Caused by' in l or l.startswith('kotlinx')][:14]
                          print('TRACE', ' | '.join(keep)[:1800])
              if failed:
                  out = (r.findtext('system-out') or '').splitlines()
                  err = (r.findtext('system-err') or '').splitlines()
                  print('OUT_LINES', len(out), 'ERR_LINES', len(err))
                  for l in out[-60:]:
                      print('OUT', l[:220])
                  for l in err[-30:]:
                      print('ERR', l[:220])
          EOF
          exit 0
