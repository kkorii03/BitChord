.AlbumSubtitleTest' --tests 'com.music.bitchord.data.model.AppleSubtitleEdgeTest' --tests 'com.music.bitchord.data.model.AppleSubtitleTest' --tests 'com.music.bitchord.data.model.ArtistCountTextTest' --tests 'com.music.bitchord.data.model.ModelsTest' --tests 'com.music.bitchord.data.model.PlaylistOrderTest' --tests 'com.music.bitchord.data.presence.PresenceTest' --tests 'com.music.bitchord.data.spotify.SpotifyLibraryTest' --tests 'com.music.bitchord.playback.BatteryPolicyTest' --tests 'com.music.bitchord.playback.ContextRegistryTest' --tests 'com.music.bitchord.playback.LocalTimingPolicyTest' --tests 'com.music.bitchord.playback.QueueBuilderDedupBoundaryTest' --tests 'com.music.bitchord.playback.QueueTimelinePolicyTest' --tests 'com.music.bitchord.playback.QueueWindowBoundaryTest' --tests 'com.music.bitchord.playback.QueueWindowTest' --tests 'com.music.bitchord.playback.SyncSafetyPolicyTest' --tests 'com.music.bitchord.playback.smart.AdvancedAutomixPlannerTest' --tests 'com.music.bitchord.playback.smart.AutomixQualityTest' --tests 'com.music.bitchord.playback.smart.PhraseBarAutomixTest' :sharedUi:jvmTest --console=plain 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          for f in shared/build/test-results/jvmTest/*.xml; do
            [ -f "$f" ] || continue
            line=$(grep -o '<testsuite [^>]*>' "$f" | head -1 || true)
            echo "::notice title=tests::$(basename "$f") $(echo "$line" | grep -oE '(tests|failures|errors|skipped)="[0-9]+"' | tr '\n' ' ')"
          done
          # One notice for every measurement: GitHub shows only ten per step.
          timing=$(grep -ho "LOOKUP_MS [^<]*" shared/build/test-results/jvmTest/*.xml 2>/dev/null | sed 's/LOOKUP_MS //' | tr '\n' '|' || true)
          [ -n "$timing" ] && echo "::notice title=timing::$timing" || true
          chroma=$(grep -ho "CHROMA [^<]*" shared/build/test-results/jvmTest/*.xml 2>/dev/null | sed 's/CHROMA //' | tr '\n' '|' || true)
          [ -n "$chroma" ] && echo "::notice title=chroma::$chroma" || true
          grep -E "^e: |FAILED|AssertionError|expected:" test.log | head -30 | while IFS= read -r l; do echo "::error title=test::$l"; done || true
          grep -E "BUILD (SUCCESSFUL|FAILED)" test.log | while IFS= read -r l; do echo "::notice title=tests-build::$l"; done || true
          exit $status

      # The lyric clock's tests live in sharedUi, which no other step runs.
      # Run even when an earlier step failed, so a pre-existing failure there
      # does not hide this module's result.
      - name: Lyric clock tests
        if: always()
        shell: bash
        run: |
          set +e -o pipefail
          chmod +x gradlew
          ./gradlew :sharedUi:jvmTest --tests '*LyricClockTest' --tests '*KoResumeCeilingCarryTest' --tests '*HomeShortsShelfTest' --tests '*KoLyricsStatusTest' --tests '*KoLeadBeforeLastWordTest' --tests '*LyricsControlPolicyTest' --tests '*KoRetimeKeyTest' --console=plain 2>&1 | tee clock.log
          status=${PIPESTATUS[0]}
          for f in sharedUi/build/test-results/jvmTest/*.xml; do
            [ -f "$f" ] || continue
            line=$(grep -o '<testsuite [^>]*>' "$f" | head -1 || true)
            echo "::notice title=clock-tests::$(basename "$f") $(echo "$line" | grep -oE '(tests|failures|errors|skipped)="[0-9]+"' | tr '\n' ' ')"
          done
          grep -E "^e: |FAILED|AssertionError|expected:" clock.log | head -30 | while IFS= read -r l; do echo "::error title=clock-test::$l"; done || true
          grep -E "BUILD (SUCCESSFUL|FAILED)" clock.log | while IFS= read -r l; do echo "::notice title=clock-tests-build::$l"; done || true
          exit $status

      - name: Compile the app
        shell: bash
        run: |
          set +e -o pipefail
          ./gradlew :app:compileProdReleaseKotlin -Pbitchord.arm64Only=true --console=plain 2>&1 | tee compile.log
          status=${PIPESTATUS[0]}
          grep -E "^e: " compile.log | head -40 | while IFS= read -r l; do echo "::error title=kotlin::$l"; done || true
