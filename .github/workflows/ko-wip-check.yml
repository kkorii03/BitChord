name: Korean WIP check

# Compiles a work-in-progress branch (ko17-wip, ko18-wip, ...) and runs the
# lyrics tests, without building or publishing a release. Releases still come
# only from main via korean-build.yml.
#
# Results are echoed as annotations (::notice / ::error) so they can be read
# with `gh run view` even where the raw log download is not reachable.
on:
  push:
    branches: ['ko*-wip']
  workflow_dispatch:

concurrency:
  group: ko-wip-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Live lookups against Vibe/Bugs and friends: reported, never blocking.
      # A Korean service's dawn maintenance (seen 04:00 KST) must not stop
      # every unrelated change from passing.
      - name: Live Korean lyrics (non-blocking)
        continue-on-error: true
        shell: bash
        env:
          LIVE_KR_LYRICS: '1'
        run: |
          set +e -o pipefail
          chmod +x gradlew
          ./gradlew :shared:jvmTest --tests 'com.music.bitchord.data.lyrics.KoreanLyricsLiveTest' --tests 'com.music.bitchord.data.lyrics.LyricsLookupTimingLiveTest' --console=plain 2>&1 | tee live.log
          status=${PIPESTATUS[0]}
          timing=$(grep -ho "LOOKUP_MS [^<]*" shared/build/test-results/jvmTest/*.xml 2>/dev/null | sed 's/LOOKUP_MS //' | tr '\n' '|' || true)
          [ -n "$timing" ] && echo "::notice title=timing::$timing" || true
          grep -E "FAILED|AssertionError" live.log | head -10 | while IFS= read -r l; do echo "::warning title=live-lyrics::$l"; done || true
          exit $status

      - name: Lyrics tests
        shell: bash
        run: |
          set +e -o pipefail
          chmod +x gradlew
          ./gradlew :shared:jvmTest --tests 'com.music.bitchord.playback.NextPrepPolicyTest' --tests 'com.music.bitchord.playback.NextPrepSkipReasonTest' --tests 'com.music.bitchord.data.lyrics.*' --tests 'com.music.bitchord.data.innertube.InnertubeSearchPrivacyTest' --tests 'com.music.bitchord.data.innertube.MusicGateFallbackTest' --tests 'com.music.bitchord.data.innertube.MusicGateFallbackProxyRecheckTest' --tests 'com.music.bitchord.data.innertube.YouTubeWebParserTest' --tests 'com.music.bitchord.data.innertube.DirectClientResolverTest' --tests 'com.music.bitchord.data.innertube.AuthorizationHeaderTest' --tests 'com.music.bitchord.data.innertube.YouTubeMusicClassifierTest' --tests 'com.music.bitchord.data.cover.*' --tests 'com.music.bitchord.data.model.DetailTargetTest' --tests 'com.music.bitchord.data.HomeChartOverlapTest' --tests 'com.music.bitchord.data.HomeGateRouteTest' --tests 'com.music.bitchord.data.LocaleTagsTranslationTargetTest' --tests 'com.music.bitchord.data.innertube.ArtistPageVideoShelfTest' --tests 'com.music.bitchord.data.innertube.StreamResolverAllScopeStampTest' --tests 'com.music.bitchord.data.innertube.StreamResolverRateLimitTest' --tests 'com.music.bitchord.data.innertube.VideoRadioChannelParseTest' --tests 'com.music.bitchord.data.innertube.VisitorDataPersistenceTest' --tests 'com.music.bitchord.data.innertube.potoken.PoTokenGeneratorCancellationTest' --tests 'com.music.bitchord.data.innertube.potoken.PoTokenGeneratorTimeoutBudgetTest' --tests 'com.music.bitchord.data.innertube.potoken.PoTokenResultCacheTest' --tests 'com.music.bitchord.data.model.SearchHistoryActionTest' --tests 'com.music.bitchord.data.sources.TrackMatcherDurationGapTest' --tests 'com.music.bitchord.data.sources.TrackMatcherOstReviewTest' --tests 'com.music.bitchord.data.videoradio.VideoRadioChannelSourceTest' --tests 'com.music.bitchord.data.videoradio.VideoRadioPolicyTest' --tests 'com.music.bitchord.playback.NextPrepSkipReasonTest' --tests 'com.music.bitchord.playback.smart.AutomixSafety1031Test' --tests 'com.music.bitchord.data.innertube.UnplayableReasonTest' --tests 'com.music.bitchord.data.sources.AudioSwitchOstTitleTest' --tests 'com.music.bitchord.data.sources.HqLibraryAutoRetryPolicyTest' --tests 'com.music.bitchord.data.sources.PlayingAudioFormatTest' --tests 'com.music.bitchord.data.sources.HqVerifyPolicyTest' --tests 'com.music.bitchord.data.videoradio.*' --tests 'com.music.bitchord.data.net.HqRetryPolicyTest' --tests 'com.music.bitchord.data.model.HomeShelfMergeTest' --tests 'com.music.bitchord.data.model.AccountIdentityMergeTest' --tests 'com.music.bitchord.data.settings.PrivateListeningTest' --tests 'com.music.bitchord.data.charts.*' --tests 'com.music.bitchord.data.RecentShelfTest' --tests 'com.music.bitchord.data.sources.*' --tests 'com.music.bitchord.data.TrackLogPersistenceTest' --tests 'com.music.bitchord.data.YouTubeFallbackFeedTest' --tests 'com.music.bitchord.data.YouTubeFallbackFeedRulesTest' --tests 'com.music.bitchord.data.YouTubeFallbackHomeCacheTest' --tests '*ExploreCategoriesTest' --tests '*ExploreCategoryFilterTest' --tests '*ExploreCategorySeedTest' --tests '*ExploreCategoryArtworkCacheTest' --tests '*YouTubeDisplayCleanerTest' --tests '*YouTubeCategoryRulesTest' --tests '*YouTubeMusicPlaylistCardsTest' --tests '*CatalogSongMapperTest' --tests '*CatalogSongMapperBudgetTest' --tests 'com.music.bitchord.data.cover.ArtworkThumbnailTest' --tests '*YouTubeWebParserPlaylistResultsTest' --tests 'com.music.bitchord.data.innertube.AccountMenuParserTest' --tests 'com.music.bitchord.data.net.*' --tests '*QueueBuilderComposeTest' --tests '*ShuffleAppendTest' --tests '*AutomixWorkPolicyTest' :sharedUi:jvmTest --tests 'com.music.bitchord.ui.LyricsProviderStateTest' --console=plain 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          for f in shared/build/test-results/jvmTest/*.xml; do
            [ -f "$f" ] || continue
            line=$(grep -o '<testsuite [^>]*>' "$f" | head -1 || true)
            echo "::notice title=tests::$(basename "$f") $(echo "$line" | grep -oE '(tests|failures|errors|skipped)="[0-9]+"' | tr '\n' ' ')"
          done
          # One notice for every measurement: GitHub shows only ten per step.
          timing=$(grep -ho "LOOKUP_MS [^<]*" shared/build/test-results/jvmTest/*.xml 2>/dev/null | sed 's/LOOKUP_MS //' | tr '\n' '|' || true)
          [ -n "$timing" ] && echo "::notice title=timing::$timing" || true
          chroma=$(grep -ho "CHROMA [^<]*" shared/build/test-results/jvmTest/*.xml 2>/dev/null | sed 's/CHROMA //' | tr '\n' '|' || true)
          [ -n "$chroma" ] && echo "::notice title=chroma::$chroma" || true
          grep -E "^e: |FAILED|AssertionError|expected:" test.log | head -30 | while IFS= read -r l; do echo "::error title=test::$l"; done || true
          grep -E "BUILD (SUCCESSFUL|FAILED)" test.log | while IFS= read -r l; do echo "::notice title=tests-build::$l"; done || true
          exit $status

      - name: Compile the app
        shell: bash
        run: |
          set +e -o pipefail
          ./gradlew :app:compileProdReleaseKotlin -Pbitchord.arm64Only=true --console=plain 2>&1 | tee compile.log
          status=${PIPESTATUS[0]}
          grep -E "^e: " compile.log | head -40 | while IFS= read -r l; do echo "::error title=kotlin::$l"; done || true
          grep -E "^w: .*(LyricsTiming|ChromaAlignment|LyricsTimeMap|LyricsOffsetSheet|AudioDecoder|TranslationAhead)" compile.log | head -20 | while IFS= read -r l; do echo "::warning title=kotlin::$l"; done || true
          grep -E "Task :app:compileProdReleaseKotlin|BUILD (SUCCESSFUL|FAILED)" compile.log | while IFS= read -r l; do echo "::notice title=compile::$l"; done || true
          exit $status

      # The app module's pure-logic tests added with the timing-cost and
      # artwork fixes. Named one by one: the rest of app/src/test is not kept
      # green (the audio output tests already fail on this branch's base).
      - name: App playback tests
        shell: bash
        run: |
          set +e -o pipefail
          ./gradlew :app:testProdDebugUnitTest --tests 'com.music.bitchord.HqSearchCacheTest' --tests 'com.music.bitchord.QualityUpgradeRefusalTest' --tests 'com.music.bitchord.playback.smart.AiTimingPolicyTest' --tests 'com.music.bitchord.playback.smart.LyricsTimingKeepTest' --tests 'com.music.bitchord.playback.AnalysisHeadRetryTest' --tests 'com.music.bitchord.ui.player.CanvasFrameRefreshTest' --tests 'com.music.bitchord.data.settings.LowPowerModeTest' --tests 'com.music.bitchord.playback.SkipSegmentsTest' --tests 'com.music.bitchord.data.taste.*' --tests 'com.music.bitchord.AddonClientHealthTest' --tests 'com.music.bitchord.AutoplaySeedTest' --tests 'com.music.bitchord.CoverLyricsVideoFlagTest' --tests 'com.music.bitchord.LyricsLoadKeyTest' --tests 'com.music.bitchord.LyricsRetryTest' --tests 'com.music.bitchord.NextPrepCacheKeyTest' --tests 'com.music.bitchord.NextPrepLogTest' --tests 'com.music.bitchord.StartupDeferredWorkTest' --tests 'com.music.bitchord.TranslationAheadOverrideTest' --tests 'com.music.bitchord.WebDavUploadsTest' --tests 'com.music.bitchord.data.innertube.potoken.PoTokenSlowCreationTest' --tests 'com.music.bitchord.data.settings.SearchHistoryAddonPersistenceTest' --tests 'com.music.bitchord.data.settings.SearchHistoryImportOrderingTest' --tests 'com.music.bitchord.data.settings.SettingsTransferRollbackTest' --tests 'com.music.bitchord.data.spotify.LocalPlaylistImportOrderingTest' --tests 'com.music.bitchord.data.spotify.LocalPlaylistImportPersistenceTest' --tests 'com.music.bitchord.data.stats.BackupImportRollbackTest' --tests 'com.music.bitchord.data.stats.BackupImportValidationTest' --tests 'com.music.bitchord.data.stats.BackupRulesSafetyTest' --tests 'com.music.bitchord.data.stats.BackupSizeBudgetTest' --tests 'com.music.bitchord.data.stats.ListeningStatsImportAtomicityTest' --tests 'com.music.bitchord.data.taste.TasteSignalsRatingBackupTest' --tests 'com.music.bitchord.data.taste.TasteSignalsRatingsBackupTest' --tests 'com.music.bitchord.download.DownloadDrainGateTest' --tests 'com.music.bitchord.download.DownloadHealthRetryPolicyTest' --tests 'com.music.bitchord.download.DownloadServiceStartIdTest' --tests 'com.music.bitchord.download.DownloadStorePublishAppliedTest' --tests 'com.music.bitchord.download.DownloadStoreStalePartTest' --tests 'com.music.bitchord.download.DownloadWorkWakeTest' --tests 'com.music.bitchord.download.DownloadedQualityStoredTierTest' --tests 'com.music.bitchord.download.DownloaderRangeTest' --tests 'com.music.bitchord.download.DownloadsFailClearsHqOverrideTest' --tests 'com.music.bitchord.download.DownloadsWorkSignalTest' --tests 'com.music.bitchord.download.HqLibraryUpgradeSettleGuardTest' --tests 'com.music.bitchord.download.HqReplacementLandedTest' --tests 'com.music.bitchord.download.HqRetryActiveTest' --tests 'com.music.bitchord.download.MvSoundRedownloadScheduleTest' --tests 'com.music.bitchord.download.RepairMeteredPolicyTest' --tests 'com.music.bitchord.playback.AutoplayCoverFilterCacheTest' --tests 'com.music.bitchord.playback.ChunkedDataSourceSleepingGatewayTest' --tests 'com.music.bitchord.playback.HqSwapPolicyEdgeTest' --tests 'com.music.bitchord.playback.LastPlayedRestoreTest' --tests 'com.music.bitchord.playback.LastPlayedWindowTest' --tests 'com.music.bitchord.playback.MediaSessionArtworkReadersTest' --tests 'com.music.bitchord.playback.NetworkOfflinePolicyTest' --tests 'com.music.bitchord.playback.NextPrepCacheKeyTest' --tests 'com.music.bitchord.playback.PartyDeferredPlayTest' --tests 'com.music.bitchord.playback.PartyMembershipTransitionTest' --tests 'com.music.bitchord.playback.PartyReconcileKeyTest' --tests 'com.music.bitchord.playback.PartyServerPreferenceTest' --tests 'com.music.bitchord.playback.PowerStateScreenTest' --tests 'com.music.bitchord.playback.QueueShuffleLogTest' --tests 'com.music.bitchord.playback.SessionFavoriteStateTest' --tests 'com.music.bitchord.playback.TranslationAheadPrepTest' --tests 'com.music.bitchord.playback.UnplayableRecoveryTest' --tests 'com.music.bitchord.playback.audio.LosslessOutputTest' --tests 'com.music.bitchord.playback.smart.HqVerificationStoreInvalidationTest' --tests 'com.music.bitchord.playback.smart.VideoAudioTimingReadyTest' --tests 'com.music.bitchord.startup.LaunchReplayTest' --tests 'com.music.bitchord.ui.DetailContinuationMergeTest' --tests 'com.music.bitchord.ui.KoreanStringsTest' --tests 'com.music.bitchord.ui.LyricsMeasurementWindowTest' --tests 'com.music.bitchord.ui.SearchRequestPipelineTest' --tests 'com.music.bitchord.widget.MediaWidgetSnapshotTest' --tests 'com.music.bitchord.AutoplayCoverSeedTest' --tests 'com.music.bitchord.ProcessRestartWarmthTest' --tests 'com.music.bitchord.data.spotify.LoadOnceTest' --tests 'com.music.bitchord.download.HqLibraryUpgradeSelectionTest' --tests 'com.music.bitchord.playback.SongCacheEvictionCountTest' --tests 'com.music.bitchord.ui.LocalMusicLoadStateTest' --tests 'com.music.bitchord.ui.SearchEmptyPipelineTest' --tests 'com.music.bitchord.ui.SearchRetryCacheTest' --tests 'com.music.bitchord.ui.UiTranslationCoverageTest' --tests 'com.music.bitchord.ui.components.AudioPipelineVerdictTest' --tests 'com.music.bitchord.ui.screens.HistoryEmptyStateTest' --tests 'com.music.bitchord.HqRateLimitRecoveryTest' --tests 'com.music.bitchord.VideoRadioAutoplayTest' --tests 'com.music.bitchord.download.DownloadsAbandonPendingTest' --tests 'com.music.bitchord.download.DownloadsQueuedPublishRaceTest' --tests 'com.music.bitchord.download.HqLibraryUpgradeBackgroundPruneTest' --tests 'com.music.bitchord.playback.CrossfadeGainTest' --tests 'com.music.bitchord.playback.HqSwapPolicyTest' --tests 'com.music.bitchord.playback.smart.HqAudioVerifyPendingRetryTest' --tests 'com.music.bitchord.playback.smart.HqVerificationSourceIdentityTest' --tests 'com.music.bitchord.StreamChoiceTest' --tests 'com.music.bitchord.data.stats.WriteThrottleTest' --tests 'com.music.bitchord.playback.LyricSubtitleSchedulerTest' --tests 'com.music.bitchord.playback.TranslationA