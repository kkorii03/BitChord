name: Test APK (x86_64, for the emulator)

# The release variant built for an x86_64 emulator, from a branch, without
# publishing anything — so a change can be tried on a signed-in app before it
# goes to main. Read the artifact locally (gh run download).
on:
  push:
    branches: ['test-apk']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Signing setup
        env:
          KO_KEYSTORE_BASE64: ${{ secrets.KO_KEYSTORE_BASE64 }}
          KO_KEYSTORE_PASSWORD: ${{ secrets.KO_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KO_KEYSTORE_BASE64" ]; then
            echo "$KO_KEYSTORE_BASE64" | base64 -d > bitchord-ko.p12
          elif [ -f .github/signing/bitchord-ko.p12 ]; then
            cp .github/signing/bitchord-ko.p12 bitchord-ko.p12
          fi
          if [ -f bitchord-ko.p12 ] && [ -n "$KO_KEYSTORE_PASSWORD" ]; then
            {
              echo "storeFile=bitchord-ko.p12"
              echo "storePassword=$KO_KEYSTORE_PASSWORD"
              echo "keyAlias=bitchordko"
              echo "keyPassword=$KO_KEYSTORE_PASSWORD"
            } > keystore.properties
          fi

      - name: Build
        run: |
          chmod +x gradlew
          for i in 1 2; do ./gradlew assembleProdRelease --console=plain && break; sleep 20; done
          ls -la app/build/outputs/apk/prod/release/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: app/build/outputs/apk/prod/release/*x86_64*.apk
