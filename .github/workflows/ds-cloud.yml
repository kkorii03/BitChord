name: DeepSeek cloud task

# One DeepSeek (OpenCode) coding task on a GitHub runner, so several can run at
# once without loading the mini PC. tools\cloud-ds.ps1 pushes a `dsq/<name>`
# branch = base + one commit holding this file and .dsq/prompt.txt. This job
# drops that commit, lets DeepSeek work on the base (it may compile and test
# here, unlike on the mini PC), re-checks the compile itself, and pushes the
# result to `cloud/<name>`, then starts the Korean WIP check on it.
on:
  push:
    branches: ['dsq/**']

permissions:
  contents: write
  actions: write

concurrency:
  group: ds-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODEL: openrouter/deepseek/deepseek-v4.1-flash-1017
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare task
        shell: bash
        run: |
          set -e
          name="${GITHUB_REF_NAME#dsq/}"
          echo "NAME=$name" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ds"
          cp .dsq/prompt.txt "$RUNNER_TEMP/ds/prompt.txt"
          git reset --hard HEAD~1
          echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git config user.name "DeepSeek (cloud)"
          git config user.email "ds-cloud@users.noreply.github.com"
          chmod +x gradlew
          npm i -g opencode-ai@1.19.3 >/dev/null 2>&1
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "openrouter/deepseek/deepseek-v4.1-flash-1017",
            "small_model": "openrouter/deepseek/deepseek-v4.1-flash-1017",
            "permission": { "edit": "allow", "bash": "allow", "webfetch": "allow" },
            "provider": { "openrouter": { "models": { "deepseek/deepseek-v4.1-flash-1017": {
              "options": { "provider": { "order": ["cloudflare", "deepseek", "deepinfra/fp8"], "allow_fallbacks": false } } } } } }
          }
          EOF
          cat > "$RUNNER_TEMP/ds/env.txt" <<'EOF'
          [Cloud runner note — overrides the task text where they differ]
          You run on a Linux GitHub runner; the working folder is the current directory (the repository).
          Read any C:\Users\jang\Desktop\BitChord\BitChord-merge (or -lane2) path in the task as the current directory.
          Here you MAY and SHOULD compile and test: ./gradlew :app:compileProdReleaseKotlin -Pbitchord.arm64Only=true --console=plain -q
          and for shared tests ./gradlew :shared:jvmTest --tests '<your test>' --console=plain -q. Fix every compile error before you finish.
          rg (ripgrep) and grep both work. Do not print whole-repository listings. Do not commit or push. Never touch .github/, keys/, *.jks or signing config.
          Battery first in app code: no periodic polling or timers, event-driven only.
          EOF

      - name: DeepSeek
        shell: bash
        run: |
          set +e
          prompt="$(cat "$RUNNER_TEMP/ds/env.txt")"$'\n\n'"$(cat "$RUNNER_TEMP/ds/prompt.txt")"
          opencode run -m "$MODEL" "$prompt" 2>&1 | tee "$RUNNER_TEMP/ds/out1.txt" | tail -c 200000
          if [ -z "$(git status --porcelain)" ]; then
            echo "::warning title=ds::no changes, retrying once"
            opencode run -m "$MODEL" "$prompt"$'\n\n'"(Retry: the last run ended with no file changes. Do not list the repository; go straight to the files named above and finish the task.)" 2>&1 | tee "$RUNNER_TEMP/ds/out2.txt" | tail -c 200000
          fi
          exit 0

      - name: Guard and compile gate
        shell: bash
        run: |
          set +e
          # Forbidden paths go back to the base, whatever DeepSeek did.
          bad=$(git status --porcelain | awk '{print $2}' | grep -E '^(\.github/|keys/|\.dsq/)|\.jks$|signing' )
          for f in $bad; do echo "::warning title=guard::reverted $f"; git checkout -- "$f" 2>/dev/null || rm -rf "$f"; done
          find . -name __pycache__ -type d -prune -exec rm -rf {} + 2>/dev/null
          git add -A
          if git diff --cached | grep -E '^\+.*(sk-or-[A-Za-z0-9-]{10,}|sk-[A-Za-z0-9]{32,})'; then
            echo "::error title=guard::key-like text in the diff, not pushing"; exit 1
          fi
          if git diff --cached --quiet; then echo "::error title=ds::no changes"; echo "RESULT=nochange" >> "$GITHUB_ENV"; exit 0; fi
          for attempt in 1 2 3; do
            ./gradlew :app:compileProdReleaseKotlin -Pbitchord.arm64Only=true --console=plain -q > compile.log 2>&1
            if [ $? -eq 0 ]; then echo "RESULT=compiled" >> "$GITHUB_ENV"; break; fi
            echo "RESULT=compile-failed" >> "$GITHUB_ENV"
            [ $attempt -eq 3 ] && break
            errs=$(grep -E '^e: ' compile.log | head -30)
            opencode run -m "$MODEL" "$(cat "$RUNNER_TEMP/ds/env.txt")"$'\n\n'"The app no longer compiles after your change. Fix these errors with minimal changes; re-read the callers and types you touch. Errors:"$'\n'"$errs"$'\n'"At the end, summary in max 6 lines." 2>&1 | tee -a "$RUNNER_TEMP/ds/fix.txt" | tail -c 50000
            bad=$(git status --porcelain | awk '{print $2}' | grep -E '^(\.github/|keys/|\.dsq/)|\.jks$|signing' )
            for f in $bad; do git checkout -- "$f" 2>/dev/null || rm -rf "$f"; done
            git add -A
          done
          rm -f compile.log
          git add -A
          git commit -q -m "cloud: $NAME ($RESULT)" -m "DeepSeek cloud task on $BASE." || true
          git push -f origin "HEAD:refs/heads/cloud/$NAME"
          echo "::notice title=result::cloud/$NAME $RESULT $(git rev-parse --short HEAD)"
          if [ "$RESULT" = compiled ]; then gh workflow run ko-wip-check.yml --repo "$GITHUB_REPOSITORY" --ref "cloud/$NAME"; fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## $NAME: ${RESULT:-?}"
            echo '```'
            git diff --stat "$BASE" HEAD 2>/dev/null | tail -30
            echo '```'
            echo '### DeepSeek summary (last 40 lines)'
            echo '```'
            cat "$RUNNER_TEMP"/ds/out*.txt 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ds-${{ env.NAME }}
          path: ${{ runner.temp }}/ds/
          retention-days: 7
