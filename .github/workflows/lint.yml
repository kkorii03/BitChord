name: Lint (on demand)

# Android Lint over the release variant: correctness, performance and unused
# resources, as an artifact to read locally (gh run download).
on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Lint
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :app:lintProdRelease -Pbitchord.arm64Only=true --console=plain --continue 2>&1 | tee lint.log
          ./gradlew :app:compileProdReleaseKotlin -Pbitchord.arm64Only=true --rerun-tasks --console=plain 2>&1 | grep -E "^w: " > kotlin-warnings.txt
          exit 0

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lint
          path: |
            app/build/reports/lint-results-prodRelease.*
            kotlin-warnings.txt
            lint.log
