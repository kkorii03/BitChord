name: Task APK (arm64, no release)

# Builds the same arm64 prodRelease APK as korean-build.yml for a work branch,
# for installing on a test phone. Unlike korean-build it never publishes a
# GitHub release: the APK is only an artifact. Signing happens afterwards on
# the mini PC, as for every other build.
on:
  push:
    branches: ['apk/**']
  workflow_dispatch:

concurrency:
  group: task-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleProdRelease -Pbitchord.arm64Only=true --stacktrace

      - name: Collect APK
        run: |
          APK=$(ls app/build/outputs/apk/prod/release/*.apk | head -1)
          mkdir -p out
          cp "$APK" out/BitChord-task-arm64.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-task-arm64
          path: out/BitChord-task-arm64.apk
