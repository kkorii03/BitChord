name: Smoke play (emulator)

# Plays a fixed set of music videos and covers on an emulator and judges the
# log with scripts/smokecheck.py: no official MV may play as an MV, covers stay
# covers, no crash. Run before any test build goes to the phone.
# Started by pushing a commit to a smoke/** branch: a workflow_dispatch needs
# the file on the default branch, and main is not changed without approval.
on:
  push:
    branches: ['smoke/**']

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDevDebug --console=plain

      # The listener's own HQ sources (no proxy), stored by tools\set-smoke-secret.bat.
      # Without them the run still judges MV/cover handling, but cannot prove HQ.
      - name: Smoke settings
        env:
          SMOKE_SETTINGS_B64: ${{ secrets.SMOKE_SETTINGS_B64 }}
        run: |
          if [ -n "$SMOKE_SETTINGS_B64" ]; then
            echo "$SMOKE_SETTINGS_B64" | base64 -d > "$RUNNER_TEMP/smoke.bitchord-settings"
            echo "SMOKE_SETTINGS_FILE=$RUNNER_TEMP/smoke.bitchord-settings" >> "$GITHUB_ENV"
            echo "::notice title=smoke::HQ sources loaded"
          else
            echo "::warning title=smoke::no SMOKE_SETTINGS_B64 secret - HQ cannot be judged"
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play and judge
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/smoke/run.sh

      - name: Report
        if: always()
        run: |
          [ -f shots/smoke-report.md ] && cat shots/smoke-report.md >> "$GITHUB_STEP_SUMMARY" || true
          [ -f shots/smoke-report.md ] && grep -E "FAIL|PASS" shots/smoke-report.md | head -10 | while IFS= read -r l; do echo "::notice title=smoke::$l"; done || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-play
          path: shots/
