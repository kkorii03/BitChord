name: Smoke play (emulator)

# Plays a fixed set of music videos and covers on an emulator and judges the
# log with scripts/smokecheck.py: no official MV may play as an MV, covers stay
# covers, no crash. Run before any test build goes to the phone.
# Started by pushing a commit to a smoke/** branch: a workflow_dispatch needs
# the file on the default branch, and main is not changed without approval.
on:
  push:
    branches: ['smoke/**']

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    # statuses: scripts/smoke/run.sh posts one live progress line per song.
    permissions:
      contents: read
      statuses: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Release APKs get the default lyrics AI keys at signing (ship_local.py);
      # without them the emulator never measures sync (deepgram=false, every
      # song sync=none), so the sync score would only grade the lyrics files.
      # Stored by tools\set-ai-secrets.ps1; absent secrets leave the build as before.
      - name: Bundle lyrics AI keys
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, re
          p = "app/src/main/res/values/strings.xml"
          s = open(p, encoding="utf-8").read()
          for name, env in (("default_deepgram_api_key", "DEEPGRAM_API_KEY"), ("default_gemini_api_key", "GEMINI_API_KEY")):
              value = os.environ.get(env, "").strip()
              if not value:
                  print(f"{name}: no secret, left empty")
                  continue
              pat = re.compile(r'<string name="%s"([^>]*)(?:/>|>[^<]*</string>)' % name)
              s, n = pat.subn(lambda m: f'<string name="{name}"{m.group(1)}>{value}</string>', s)
              print(f"{name}: bundled={n == 1}")
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDevDebug --console=plain

      # The listener's own HQ sources (no proxy), stored by tools\set-smoke-secret.bat.
      # Without them the run still judges MV/cover handling, but cannot prove HQ.
      - name: Smoke settings
        env:
          SMOKE_SETTINGS_B64: ${{ secrets.SMOKE_SETTINGS_B64 }}
        run: |
          if [ -n "$SMOKE_SETTINGS_B64" ]; then
            echo "$SMOKE_SETTINGS_B64" | base64 -d | sed '1s/^\xEF\xBB\xBF//' > "$RUNNER_TEMP/smoke.bitchord-settings"
            # The Tokyo VM's 8888 exits on a datacenter IP, which YouTube answers
            # with its bot check (no audio, runs 40289071778/40304462986). Its
            # 8889 exits on the M8's home IP through tools\homeproxy-tunnel.ps1.
            # The HQ sources' servers rate-limit runner IPs as well, so the
            # whole emulator goes through 8889, not just the app's YouTube.
            python3 scripts/smoke/set_proxy_port.py "$RUNNER_TEMP/smoke.bitchord-settings" "${SMOKE_PROXY_PORT:-8889}" --emulator
            echo "SMOKE_SETTINGS_FILE=$RUNNER_TEMP/smoke.bitchord-settings" >> "$GITHUB_ENV"
            echo "::notice title=smoke::HQ sources loaded"
          else
            echo "::warning title=smoke::no SMOKE_SETTINGS_B64 secret - HQ cannot be judged"
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play and judge
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Device-wide proxy through the runner's authfwd (see set_proxy_port.py).
          script: |
            if [ -n "$SMOKE_UPSTREAM_PROXY" ]; then (nohup python3 scripts/smoke/authfwd.py "$SMOKE_UPSTREAM_PROXY" > "$RUNNER_TEMP/authfwd.log" 2>&1 &) ; sleep 2; adb shell settings put global http_proxy 10.0.2.2:3128; fi
            bash scripts/smoke/run.sh

      - name: Report
        if: always()
        run: |
          [ -f shots/smoke-report.md ] && cat shots/smoke-report.md >> "$GITHUB_STEP_SUMMARY" || true
          [ -f shots/smoke-report.md ] && grep -E "FAIL|PASS" shots/smoke-report.md | head -10 | while IFS= read -r l; do echo "::notice title=smoke::$l"; done || true

      # The artifact of a public repo is downloadable by anyone; a bundled key
      # that reached a log line (e.g. a request URL) must not go with it.
      - name: Scrub keys from artifact
        if: always()
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          keys = [k for k in (os.environ.get("DEEPGRAM_API_KEY", "").strip(), os.environ.get("GEMINI_API_KEY", "").strip()) if k]
          hits = 0
          for f in pathlib.Path("shots").rglob("*"):
              if not keys or not f.is_file() or f.suffix in (".wav", ".png", ".webm"):
                  continue
              b = f.read_bytes()
              n = b
              for k in keys:
                  n = n.replace(k.encode(), b"***")
              if n != b:
                  hits += 1
                  f.write_bytes(n)
          print(f"scrubbed files: {hits}")
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-play
          path: shots/
